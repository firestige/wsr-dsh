name: Release Candidate

on:
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: Exact prerelease tag, for example 0.1.0-rc.1
        required: true
        type: string

permissions: {}

jobs:
  qualify-candidate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install the frozen DSH qualification CLI
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @deepseek-ai/dsh@0.1.1-rc.2
      - run: npm test
      - run: npm run build
      - run: npm run pack:verify
      - name: Verify immutable remote owner artifact
        run: curl --fail --location --silent --show-error --output /dev/null https://github.com/firestige/wsr-execution/releases/download/0.1.4-rc.1/wsr-execution-0.1.4.tgz
      - run: npm run qualify:clean-profile
      - run: npm run qualify:lifecycle
      - run: npm run qualify:provider-routing
      - run: npm run qualify:real-harness
        env:
          WSR_CHROME_BINARY: /usr/bin/google-chrome
      - name: Build candidate artifact set
        run: npm run release:candidate -- "$RUNNER_TEMP/candidate"
        env:
          WSR_RELEASE_CHANNEL: candidate
          WSR_CANDIDATE_TAG: ${{ inputs.candidate_tag }}
      - run: npm run provenance:verify -- "$RUNNER_TEMP/candidate"
      - run: npm run release:qualify -- "$RUNNER_TEMP/candidate"
      - run: test -f "$RUNNER_TEMP/candidate/release-qualification.json"
      - uses: actions/upload-artifact@v4
        with:
          name: wsr-dsh-${{ inputs.candidate_tag }}
          path: ${{ runner.temp }}/candidate/*
          if-no-files-found: error
          retention-days: 30
      - id: release-app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.WSR_RELEASE_APP_ID }}
          private-key: ${{ secrets.WSR_RELEASE_APP_PRIVATE_KEY }}
          owner: firestige
          repositories: wsr-dsh
      - name: Create immutable candidate release
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        run: gh release create "$CANDIDATE_TAG" "$RUNNER_TEMP/candidate"/* --repo firestige/wsr-dsh --target "$GITHUB_SHA" --prerelease --verify-tag=false --title "$CANDIDATE_TAG"
